# One VM, `docker compose up -d` — PLAN §9. M1 (PLAN §10): `site`, `server`
# (sessions/execution) and the runner pool now all exist — see STATUS.md for
# what's actually been verified end to end and what's still open.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - site
      - server

  site:
    build:
      context: ./site
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - CONTENT_ROOT=/content
      - PORT=3000
    volumes:
      # Bind-mounted, not baked into the image: content.ts reads these
      # files per request, not at startup, so editing a guide or exercise
      # here takes effect on the next request — no rebuild, no restart.
      # See site/Dockerfile's comment on the same point.
      - ./content:/content:ro
    expose:
      - '3000'
    # Published for looking at the site in isolation. Pages work here;
    # `/api/*` does not and cannot — it lives on `server`, and Caddy is
    # what puts the two behind one origin. Requests to it answer 421
    # saying so rather than 404ing.
    ports:
      - '3000:3000'

  # The sessions/execution half of the Alula backend (PLAN §4) — leases a
  # runner per session and streams its build/run output over Channels. The
  # *content* half (serving compiled exercise/guide JSON) isn't built —
  # `site` still reads `content/` directly (see site/src/lib/server/content.ts)
  # and there's no proven need to move that yet; see STATUS.md.
  server:
    build: ./server
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    expose:
      - '9100'
    networks:
      - default
      - runner-internal
    # Joins both networks: `default` to be reachable from Caddy, and
    # `runner-internal` to reach the runner pool by name — the only thing
    # allowed onto that network besides the runners themselves.

  # Sandboxed execution pool (PLAN §4/§5). Every flag below was verified
  # against a real running container, not assumed from the plan's own
  # prose — several (the tmpfs uid/gid, the `exec` mount option, the
  # memory ceiling) turned out wrong on the first attempt. See STATUS.md
  # for the specific failures each one fixed.
  #
  # Four *named* services, not one service with `deploy.replicas: 4` (an
  # earlier version of this file did exactly that, and it was wrong: a
  # replicated Compose service round-robins one shared hostname across
  # its containers via Docker's embedded DNS, so there is no stable name
  # to address one specific replica by. A session's lease lives in one
  # container's workspace — the server has to keep talking to the exact
  # same one for the session's whole lifetime, and the Caddyfile's own
  # `/preview/N/*` design (PLAN §4) already assumed named
  # `runner-1`/`runner-2`/... services for the same reason. Named
  # services fix both at once. `&runner-base`/`<<:` (YAML merge) keeps
  # the identical hardening config from being repeated four times.
  runner-1: &runner-base
    build: ./runner
    read_only: true
    tmpfs:
      # uid/gid must match the image's `runner` user exactly (10001, not
      # the commonly-assumed 1000) — a mismatch here is a silent
      # permission-denied at container start, not a config-time error.
      # `exec` is required, not optional: SwiftPM compiles and then
      # executes a temporary manifest-evaluation binary under `/tmp` on
      # every build, and Docker's tmpfs mounts are `noexec` by default.
      - /workspace:size=2g,uid=10001,gid=10001,exec
      - /tmp:size=256m,uid=10001,gid=10001,exec
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 4g
    cpus: 2.0
    networks:
      - runner-internal
    # No `ports:`/`expose:` — nothing outside `runner-internal` can reach
    # this at all, including the host. The server joins this same
    # network to lease sessions from the pool by service name
    # (`runner-1:9000`, matching the supervisor's `EXPOSE 9000`).

  runner-2:
    <<: *runner-base

  runner-3:
    <<: *runner-base

  runner-4:
    <<: *runner-base

  # The DB tier's shared server (PLAN §3/§4, M2). `fledge_seed` is
  # built once, at first container start, from `postgres/schema.sql` +
  # `postgres/seed.sql` — copied verbatim from the benchmark suite (PLAN
  # §4: "the issues/projects/users domain reused from the benchmark
  # suite") — via the official image's `docker-entrypoint-initdb.d`
  # convention. That convention only runs against a fresh, empty data
  # directory: once `postgres-data` has data on it, editing either SQL
  # file and restarting the container does nothing — a schema/seed change
  # needs a fresh volume (`docker compose down -v` or removing just this
  # volume) to actually take effect.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=fledge_seed
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fledge_dev}
    volumes:
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./postgres/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    networks:
      - runner-internal
    # No `ports:`/`expose:` beyond `runner-internal` — only `server`
    # (session provisioning: `CREATE`/`DROP DATABASE` — not yet
    # implemented, see STATUS.md) and the runners themselves (once a
    # leased session is actually on the `db` tier) ever need to reach
    # this, and both already sit on this network.

networks:
  # `internal: true` gives this network no route to the outside world at
  # all — verified this is what actually enforces "no egress except
  # Postgres" (PLAN §5), as opposed to `--network none` on the runner
  # itself, which also blocks the *server* from reaching it and would
  # make the whole pool unleasable. Postgres, once it exists, joins this
  # same network so runners can still reach exactly that one thing.
  runner-internal:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
