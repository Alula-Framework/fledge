app:
  name: server

server:
  host: 0.0.0.0
  port: 9100

# The fixed runner pool (PLAN §4) — named services, not `deploy.replicas`;
# see docker-compose.yml's comment on why a replicated service can't be
# addressed by one stable hostname per container, which session-sticky
# leasing needs.
runners:
  pool:
    - http://runner-1:9000
    - http://runner-2:9000
    - http://runner-3:9000
    - http://runner-4:9000

session:
  idleTimeoutSeconds: 600
  hardCapSeconds: 3600
  reapIntervalSeconds: 30

# Session-database provisioning (PLAN §3's db tier) — matches
# docker-compose.yml's postgres service exactly: same host (the compose
# service name), same POSTGRES_PASSWORD default, same seeded template
# database name.
postgres:
  host: postgres
  port: 5432
  username: postgres
  password: fledge_dev
  templateDatabase: fledge_seed
