name: Reference docs → GitHub Pages

# PLAN §8a: alula/alula-data/hangar/swift-changeset's own CI already
# *generates* DocC with --warnings-as-errors (a verification gate), but
# nothing publishes it anywhere today. This workflow is the missing half,
# built here rather than in those repos so it doesn't touch their CI on
# their maintainer's behalf — it clones tagged releases read-only and owns
# its own publish destination.
#
# swift-changeset was missing from this workflow entirely until a user
# noticed Changeset/ValidationRule/TableModel had no reference docs even
# though Part 2 of the tutorial teaches them directly — an omission, not a
# deliberate scope cut; every other library the tutorial teaches from is
# here.
#
# Not triggered on every push: DocC generation across ~20+ targets across
# four repos is not free, and reference docs don't need to move on every
# commit to this repo's main. Run it when a referenced framework cuts a
# release, or by hand.
on:
  workflow_dispatch:
    inputs:
      alula_ref:
        description: 'alula tag/branch to document'
        default: 'main'
      hangar_ref:
        description: 'hangar tag/branch to document'
        default: 'main'
      alula_data_ref:
        description: 'alula-data tag/branch to document'
        default: 'main'
      swift_changeset_ref:
        description: 'swift-changeset tag/branch to document'
        default: 'main'
  schedule:
    # Weekly, as a floor — catches drift between releases without needing
    # someone to remember to run this by hand. Real releases should
    # workflow_dispatch this with the actual tag.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: swift:6.3.3
    steps:
      # Every checkout below names an external repo (`repository:` +
      # `path:`), which is the *only* kind of checkout this workflow ever
      # had — there was never a plain `actions/checkout@v4` for this repo
      # itself, so `scripts/generate-docs-index.py` never existed in the
      # workspace at all. Caught only by actually running this workflow:
      # every step that only touches the three cloned repos (the DocC
      # generation loops) worked fine regardless, right up until the one
      # step that needed this repo's own `scripts/`.
      - name: Checkout fledge
        uses: actions/checkout@v4

      - name: Checkout alula
        uses: actions/checkout@v4
        with:
          repository: Alula-Framework/alula
          ref: ${{ inputs.alula_ref || 'main' }}
          path: alula

      - name: Checkout hangar
        uses: actions/checkout@v4
        with:
          repository: Alula-Framework/hangar
          ref: ${{ inputs.hangar_ref || 'main' }}
          path: hangar

      - name: Checkout alula-data
        uses: actions/checkout@v4
        with:
          repository: Alula-Framework/alula-data
          ref: ${{ inputs.alula_data_ref || 'main' }}
          path: alula-data

      - name: Checkout swift-changeset
        uses: actions/checkout@v4
        with:
          repository: Alula-Framework/swift-changeset
          ref: ${{ inputs.swift_changeset_ref || 'main' }}
          path: swift-changeset

      # The base path segment MUST match where the artifact is actually
      # served, or every relative asset link in the generated pages 404s —
      # the single most common DocC-on-Pages mistake, and worth this
      # explicit variable rather than a literal repeated per invocation.
      - name: Generate alula docs
        working-directory: alula
        env:
          ALULA_BUILD_DOCS: '1'
        run: |
          mkdir -p ../site-out/alula
          for target in AlulaCore AlulaConfig AlulaConfigCore AlulaWeb \
                        AlulaChannels AlulaChannelsProtocol \
                        AlulaChannelsClient AlulaChannelsTesting \
                        AlulaPubSub AlulaPubSubTesting AlulaPresence \
                        AlulaPresenceProtocol AlulaPresenceClient \
                        AlulaActuator AlulaSecurityCore AlulaWebTesting \
                        AlulaTransport AlulaScheduler; do
            echo "::group::alula/$target"
            swift package --enable-all-traits \
              --allow-writing-to-directory "../site-out/alula/$target" \
              generate-documentation --target "$target" \
              --transform-for-static-hosting \
              --hosting-base-path "fledge/alula/$target" \
              --output-path "../site-out/alula/$target"
            echo "::endgroup::"
          done

      - name: Generate hangar docs
        working-directory: hangar
        env:
          HANGAR_BUILD_DOCS: '1'
        run: |
          mkdir -p ../site-out/hangar
          for target in Hangar HangarIntrospection; do
            echo "::group::hangar/$target"
            swift package \
              --allow-writing-to-directory "../site-out/hangar/$target" \
              generate-documentation --target "$target" \
              --transform-for-static-hosting \
              --hosting-base-path "fledge/hangar/$target" \
              --output-path "../site-out/hangar/$target"
            echo "::endgroup::"
          done

      - name: Generate alula-data docs
        working-directory: alula-data
        env:
          ALULA_BUILD_DOCS: '1'
        run: |
          mkdir -p ../site-out/alula-data
          for target in AlulaCache AlulaCacheTesting AlulaDataCore \
                        AlulaDataTesting AlulaMigrateCore \
                        AlulaDataPostgres AlulaMigrate \
                        AlulaSchedulerPostgres AlulaCacheValkey \
                        AlulaDataValkey AlulaPubSubValkey; do
            echo "::group::alula-data/$target"
            swift package --enable-all-traits \
              --allow-writing-to-directory "../site-out/alula-data/$target" \
              generate-documentation --target "$target" \
              --transform-for-static-hosting \
              --hosting-base-path "fledge/alula-data/$target" \
              --output-path "../site-out/alula-data/$target"
            echo "::endgroup::"
          done

      - name: Generate swift-changeset docs
        working-directory: swift-changeset
        env:
          SWIFT_CHANGESET_BUILD_DOCS: '1'
        run: |
          mkdir -p ../site-out/swift-changeset
          for target in Changesets; do
            echo "::group::swift-changeset/$target"
            swift package \
              --allow-writing-to-directory "../site-out/swift-changeset/$target" \
              generate-documentation --target "$target" \
              --transform-for-static-hosting \
              --hosting-base-path "fledge/swift-changeset/$target" \
              --output-path "../site-out/swift-changeset/$target"
            echo "::endgroup::"
          done

      # The swift:6.3.3 container image has no Python at all — caught only
      # by actually running this workflow for real, since every local dev
      # machine has python3 and never exposed the gap.
      - name: Install Python
        run: apt-get update && apt-get install -y --no-install-recommends python3

      # DocC's per-target archives don't self-assemble into a site — this
      # is the small combined landing page PLAN §8a calls for. Generated
      # here rather than hand-authored so adding a target to the loops
      # above is the only edit a future change needs.
      - name: Generate index
        run: python3 scripts/generate-docs-index.py site-out/ site-out/index.html

      - name: Smoke-check hosting base path
        run: |
          # The most common DocC-on-Pages mistake: a base path that doesn't
          # match where the artifact is actually served makes every JS/CSS
          # asset 404, and the page renders as a permanently empty
          # <div id="app"> — no error, no console noise a curl-based check
          # would catch, just a blank page forever. The previous version of
          # this check only confirmed the base-path string appeared
          # *somewhere* in the output, which is worthless: DocC always
          # bakes in whatever `--hosting-base-path` it was given, correct
          # or not, so that check passed even while every page was blank
          # in production. This instead extracts the baked-in baseUrl and
          # confirms a directory actually exists where it points.
          BASE_URL=$(grep -o 'var baseUrl = "[^"]*"' site-out/alula/AlulaCore/documentation/alulacore/index.html | sed 's/var baseUrl = "//; s/"$//')
          # Strip the GitHub Pages project-site prefix (this repo's own
          # name) — real once deployed, but not part of the artifact
          # itself, which becomes Pages' served root.
          RELATIVE=${BASE_URL#/fledge/}
          RELATIVE=${RELATIVE%/}
          if [ ! -d "site-out/$RELATIVE" ]; then
            echo "::error::hosting-base-path baked into AlulaCore's docs ($BASE_URL) has no matching directory at site-out/$RELATIVE — every asset on every generated page will 404."
            exit 1
          fi
          echo "hosting-base-path OK: site-out/$RELATIVE exists, matching baked-in baseUrl $BASE_URL"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
