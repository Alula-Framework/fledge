name: Exercises

# Builds and runs every exercise's real code (PLAN §6: "builds and runs
# every app-b solution, and executes every snippet solution"). This is the
# guarantee that replaced the interactive app tier — see STATUS.md. The
# tier was expensive to *serve*; compiling and running the exercises is
# cheap, and that is where the bugs actually surfaced.
#
# Deliberately not `paths:`-filtered. A break here usually comes from
# upstream — an Alula or Hangar release changing an API the content
# teaches — rather than from a content edit, and a path filter would make
# this pass on exactly the pushes least likely to have caused it.

on:
  push:
    branches: [main]
  pull_request:
  # Upstream moves without touching this repo, so also check on a
  # schedule: an Alula release that breaks a tutorial step should break
  # this, not a learner's morning.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  exercises:
    name: Build and run every exercise
    runs-on: ubuntu-latest
    # The toolchain the runner image and the tutorial's own prose pin.
    container: swift:6.3.3
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fledge_ci
          POSTGRES_DB: fledge_seed
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # The app tier's exercises are diffs against a real `alula new`
      # template, so the templates have to be present to materialise them.
      # Checked out rather than vendored: the point of the diff format is
      # that the CLI stays the single source of truth for project shape.
      - name: Check out alula-cli for its templates
        uses: actions/checkout@v4
        with:
          repository: Alula-Framework/alula-cli
          path: alula-cli

      # The swift image carries no python3 and no rsync — both verified
      # missing by running these steps in the real image, not assumed.
      - name: Install python3, psql and rsync
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 postgresql-client rsync

      # The service container can't run init scripts, so the seed is
      # applied here — from the same schema.sql/seed.sql the db tier
      # itself uses, so CI and the real thing can't drift apart.
      - name: Seed the database
        env:
          PGPASSWORD: fledge_ci
        run: |
          psql -h postgres -U postgres -d fledge_seed -v ON_ERROR_STOP=1 \
            -f postgres/schema.sql
          psql -h postgres -U postgres -d fledge_seed -v ON_ERROR_STOP=1 \
            -f postgres/seed.sql

      - name: Build and run the exercises
        env:
          DATABASE_URL: postgres://postgres:fledge_ci@postgres:5432/fledge_seed
        run: |
          python3 scripts/check-exercises.py \
            --templates alula-cli/templates \
            --database-url "$DATABASE_URL"
